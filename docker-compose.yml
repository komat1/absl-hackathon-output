services:
  db:
    image: postgres:16-alpine
    container_name: asml-db
    environment:
      POSTGRES_DB: copilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"   # 5434: another project already holds 5433 on this machine          
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on an empty data directory, in filename order.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d copilot"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
